server:
  port: 9101

spring:
  application:
    name: aegis-tenant-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_tenant}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

aegis:
  jwt:
    # Split-horizon (see ResourceServerJwtConfig): fetch JWKS from a reachable in-network URI and
    # validate iss against an allowlist, so browser tokens (iss=localhost:9000) AND in-network service
    # tokens (iss=authorization-server:9000) are both accepted. A single issuer-uri cannot satisfy both.
    jwk-set-uri: ${AEGIS_JWKS_URI:http://localhost:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:http://localhost:9000,http://authorization-server:9000}
  cors:
    allowed-origins: ${AEGIS_CORS_ORIGINS:https://app.aegis.local}
  domains:
    # White-label sign-in host verification. When true, verify() skips the DNS TXT check (local dev
    # only, since localhost has no DNS records). Keep false in every real environment.
    auto-verify: ${AEGIS_DOMAINS_AUTO_VERIFY:false}
    # CNAME target returned to tenants so they can route their custom host to the Aegis ingress.
    ingress-target: ${AEGIS_DOMAINS_INGRESS_TARGET:ingress.aegis.example}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
