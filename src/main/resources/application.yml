server:
  port: 9101

spring:
  flyway:
    enabled: true
    # Pre-Flyway databases already have these tables (they were created by
    # ddl-auto). Baselining marks them at the baseline version and skips V1
    # instead of replaying it and failing on "relation already exists".
    baseline-on-migrate: true
  application:
    name: aegis-tenant-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_tenant}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      # L-edge-2: never mutate the schema of the credential/tenant store implicitly. Ship 'validate';
      # a migration tool (or the dev profile / test override) owns schema changes.
      ddl-auto: ${AEGIS_JPA_DDL_AUTO:validate}
    open-in-view: false

aegis:
  jwt:
    # Split-horizon (see ResourceServerJwtConfig): fetch JWKS from a reachable in-network URI and
    # validate iss against an allowlist. M-edge-2/L-edge-3: default to HTTPS — the in-network hop must
    # be TLS (service-mesh mTLS in prod) so a MitM cannot substitute JWKS signing keys and forge
    # tokens. The plaintext-HTTP split-horizon defaults for local dev live under the 'dev' profile.
    jwk-set-uri: ${AEGIS_JWKS_URI:https://authorization-server:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:https://authorization-server:9000}
    # M-edge-1: when set, require this value in the token 'aud' (defeats cross-service token replay).
    # Unset = no-op (issuer + expiry still enforced). Set per-env, e.g. AEGIS_JWT_AUDIENCE=aegis-tenant-service.
    expected-audience: ${AEGIS_JWT_AUDIENCE:}
  cors:
    allowed-origins: ${AEGIS_CORS_ORIGINS:https://app.aegis.local}
  domains:
    # White-label sign-in host verification. When true, verify() skips the DNS TXT check (local dev
    # only, since localhost has no DNS records). Keep false in every real environment.
    auto-verify: ${AEGIS_DOMAINS_AUTO_VERIFY:false}
    # CNAME target returned to tenants so they can route their custom host to the Aegis ingress.
    ingress-target: ${AEGIS_DOMAINS_INGRESS_TARGET:ingress.aegis.example}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
# Local development only (SPRING_PROFILES_ACTIVE=dev). Restores the plaintext-HTTP split-horizon JWKS
# defaults (browser tokens iss=localhost:9000 AND in-network tokens iss=authorization-server:9000) and
# an auto-DDL schema, so `docker compose up` works without a TLS mesh or a migration step. Never
# activate this profile in a real environment.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
aegis:
  jwt:
    jwk-set-uri: ${AEGIS_JWKS_URI:http://localhost:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:http://localhost:9000,http://authorization-server:9000}
