server:
  port: 9101

spring:
  application:
    name: aegis-tenant-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_tenant}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AEGIS_ISSUER:http://localhost:9000}

aegis:
  cors:
    allowed-origins: ${AEGIS_CORS_ORIGINS:https://app.aegis.local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
